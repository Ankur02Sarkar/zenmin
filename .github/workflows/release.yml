name: Build and Release
on:
  push:
    branches:
      - beta/no-distractions

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-15
            env:
              SDKROOT: /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
            cmd: bun run buildMacIntel
            artifact_name: macos-x64
            artifact_path: dist/app/*.zip
          - os: macos-15
            env:
              SDKROOT: /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
            cmd: bun run buildMacArm
            artifact_name: macos-arm64
            artifact_path: dist/app/*.zip
    env:
      SDKROOT: ${{ matrix.env.SDKROOT }}
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Rename .npmrc for bun compatibility
        run: mv .npmrc .npmrc.bak 2>/dev/null || true
      - run: bun install
      - name: Build ${{ matrix.artifact_name }}
        run: ${{ matrix.cmd }}
      - name: Upload ${{ matrix.artifact_name }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-artifact
          path: ${{ matrix.artifact_path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Get Version and Create Tag
        id: version
        run: |
          VERSION=$(grep '"version"' package.json | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          tag_name: v${{ steps.version.outputs.VERSION }}
          files: |
            artifacts/macos-x64/**/*.zip
            artifacts/macos-arm64/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}