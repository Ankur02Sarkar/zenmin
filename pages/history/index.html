<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>History</title>
    <link rel="stylesheet" href="../../css/base.css" />
    <link rel="stylesheet" href="history.css" />
    <link rel="stylesheet" href="../../ext/icons/iconfont.css" />
    <link rel="stylesheet" href="../pagebase.css" />
  </head>
  <body>
    <div class="header">
      <h1 data-string="specialPageHistory">History</h1>
      <div class="tab-bar">
        <button class="tab-btn active" id="tab-history" type="button">
          Browsing History
        </button>
        <button class="tab-btn" id="tab-closed" type="button">
          Recently Closed
        </button>
      </div>
      <div class="header-actions">
        <div class="search-container">
          <input
            type="text"
            id="search-input"
            placeholder="Search history..."
          />
        </div>
        <button id="clear-all-button" class="danger-button" type="button">
          Clear All
        </button>
      </div>
    </div>
    <div class="content" id="history-container">
      <div class="history-list" id="history-list"></div>
      <div class="empty-state" id="empty-state" hidden>
        <span data-string="historyEmpty">No history yet.</span>
      </div>
      <div class="loading-state" id="loading-state">
        <span>Loading...</span>
      </div>
      <div class="error-state" id="error-state" hidden>
        <span>Failed to load history.</span>
        <button id="retry-button" type="button">Retry</button>
      </div>
    </div>

    <!-- Recently Closed panel -->
    <div class="content" id="closed-container" hidden>
      <div class="history-list" id="closed-list"></div>
      <div class="empty-state" id="closed-empty" hidden>
        <span>No recently closed tabs.</span>
      </div>
    </div>

    <script src="../../js/util/settings/settingsPreload.js"></script>
    <script src="../../js/util/settings/settingsContent.js"></script>
    <script src="../../dist/localization.build.js"></script>
    <script src="history.js"></script>
  </body>
</html>
